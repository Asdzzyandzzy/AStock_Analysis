[project]
name = "astock-analysis"
version = "0.1.0"
description = "A 股日内逐笔成交分析与可选机器学习示例"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "akshare>=1.16.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "plotly>=5.18.0",
  "PyYAML>=6.0.0",
  "streamlit>=1.32.0",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3.0"]

[tool.ruff]
line-length = 120
target-version = "py310"
